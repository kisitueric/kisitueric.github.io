<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="https://kisitu.work.gd/images/bg.png">

  <title> Etech</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: white;
      overflow: hidden;
    }

    header.background-image {
      background-image: url('https://kisitu.work.gd/images/etech.gif');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .text-container {
      text-align: center;
      background: rgba(0, 0, 0, 0.5);
      padding: 40px;
      border-radius: 12px;
      max-width: 700px;
    }

    h1.animated-text {
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    .line, .line3 {
      height: 2px;
      background: white;
      margin: 10px auto;
      width: 60%;
    }

    .act {
      font-size: 1.2em;
      margin: 15px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .countdown-text {
      font-size: 1em;
      margin-top: 20px;
      font-weight: 600;
    }

    .countdown-number {
      font-size: 1.5em;
      display: inline;
    }
/* Loader background */
#loader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100px;
  height: 100px;
  background: transparent; /* background color */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* Modern Apple/Android style spinner */
.spinner {
  width: 50px;
  height: 50px;
  border: 6px solid #e0e0e0;
  border-top: 6px solid #007aff; /* iOS blue */
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

/* Animation keyframes */
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}


  </style>
</head>
<body>
  <header class="background-image">
    <div class="text-container">
      <h1 id="home" class="animated-text title-poppins"><i src="https://kisitu.work.gd/images/logo.png" width="300" height="200" alt="Etech logo">E</i>TECH</h1>
      <div class="line"></div>

      <p><img src="https://kisitu.work.gd/images/banner.png" width="220px" height="150px" alt="Etech logo"></p>

      <h2 class="act">
        <img src="https://kisitu.work.gd/images/bg.png" width="50" height="50" alt=" icon">
        All IT, Systems Analysis, Maintenance, Website Developer, Graphics Designer & Business
      </h2>

      <div class="line3"></div>
<h3> Loading Landing Page...</h3>
      <h4 class="act">
        <img src="https://kisitu.work.gd/images/profile.png" width="70" height="60" alt=" icon">
        You’ll be redirected in <span class="countdown-number" id="countdown">7</span> seconds…
      </h4>

      <p class="countdown-text">
        <div id="loader">
  <div class="spinner"></div>
</div>

<!-- Your site content -->
<div id="content" style="display:none;">
  <!-- rest of your page -->
</div>

        <br>
        <strong><a href="https://home.kisitu.work.gd" style="color: #00ffff;">HOME PAGE</a></strong>
      </p>
    </div>
  </header>

  <script>
    let countdown = 10;
    const countdownElement = document.getElementById('countdown');

    const timer = setInterval(() => {
      countdown--;
      countdownElement.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(timer);
        window.location.href = "https://home.kisitu.work.gd/EtechLandingPage/landingpage.html"; // Redirect to the landing page
      }
    }, 1000);
  </script>
</body>
</html>
